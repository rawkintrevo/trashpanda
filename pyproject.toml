[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trashpanda"
version = "0.1.0"
description = "Deterministic tiny causal language model training"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "transformers>=4.40",
  "tokenizers>=0.15",
]

[project.optional-dependencies]
huggingface = ["transformers>=4.40", "tokenizers>=0.15"]
datasets = ["datasets>=2.16"]
test = ["pytest>=7"]

[project.scripts]
trashpanda = "trashpanda.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
